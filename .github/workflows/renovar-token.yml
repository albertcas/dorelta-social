# El token de Instagram caduca a los 60 días. Esto lo renueva el 1 y el 15 de
# cada mes, muy por delante de la caducidad.
#
# Si Instagram devuelve un token distinto, hay que guardarlo como secreto, y eso
# el GITHUB_TOKEN normal no puede hacerlo: necesita el secreto GH_PAT (un token
# de GitHub de grano fino con permiso «Secrets: read and write» sobre este
# repo). Sin GH_PAT, el flujo se pone en rojo y avisa para renovarlo a mano.
name: Renovar token de Instagram

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          respuesta=$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}")
          nuevo=$(echo "$respuesta" | jq -r '.access_token // empty')
          dias=$(echo "$respuesta" | jq -r '(.expires_in // 0) / 86400 | floor')
          if [ -z "$nuevo" ]; then
            echo "::error::Instagram no ha renovado el token: $(echo "$respuesta" | jq -c '.error // .')"
            exit 1
          fi
          echo "::add-mask::$nuevo"
          echo "Token renovado: caduca dentro de $dias días."
          if [ "$nuevo" = "$IG_TOKEN" ]; then exit 0; fi
          if [ -z "$GH_PAT" ]; then
            echo "::error::Instagram ha dado un token nuevo y no hay GH_PAT para guardarlo. Genera uno en Meta y guárdalo con: gh secret set IG_TOKEN --repo $REPO"
            exit 1
          fi
          echo "$nuevo" | GH_TOKEN="$GH_PAT" gh secret set IG_TOKEN --repo "$REPO"
          echo "Secreto IG_TOKEN actualizado."
