# Publica en Instagram lo que toca de cola.json. Sustituye a Metricool.
#
# Corre cada 15 minutos (GitHub puede retrasar los cron unos minutos en horas
# punta: una publicación de las 10:00 puede salir a las 10:10). También se puede
# lanzar a mano desde la pestaña Actions, con un id para publicarlo ya.
name: Publicar en Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      solo:
        description: "id de cola.json para publicar ya, «probar» para comprobar el token (vacío = lo que toque por hora)"
        required: false
        default: ""

permissions:
  contents: write

# Dos ejecuciones a la vez podrían publicar lo mismo dos veces.
concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SOLO: ${{ inputs.solo }}
        run: |
          if [ "$SOLO" = "probar" ]; then node scripts/publicar.mjs --probar
          elif [ -n "$SOLO" ]; then node scripts/publicar.mjs --solo "$SOLO"
          else node scripts/publicar.mjs; fi

      # Siempre, también si algo falló: lo que sí se publicó tiene que quedar
      # apuntado o la siguiente ejecución lo repetiría.
      - name: Guardar estado.json
        if: always()
        run: |
          if git diff --quiet -- estado.json; then exit 0; fi
          git config user.name "dorelta-publicador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git commit -m "Estado de publicación $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1
